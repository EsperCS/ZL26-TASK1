[project]
name = "zaloai-challenge-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EsperCS", email = "lnguyenthiennhan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "ctranslate2>=4.8.4",
    "datasets>=5.1.0",
    "faster-whisper>=1.2.1",
    "jiwer>=4.0.0",
    "pandas>=3.1.0",
    "peft>=0.21.2",
    "polars>=2.1.0",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "sentencepiece>=0.2.2",
    "sherpa-onnx>=2.0.1",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.21.0",
]

[project.scripts]
zaloai-challenge-2026 = "zaloai_challenge_2026:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "src", "train"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["zaic_tools", "train/zaic_tools", "public_test/zaic_tools", "train+public_test"]

